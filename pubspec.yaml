name: vortax_labs
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+4

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.4
  network_info_plus: ^7.0.0
  permission_handler: ^12.0.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# The following section is specific to Flutter packages.
flutter:

  # Ensures the Material Icons font is included with your application.
  uses-material-design: true

  # App image assets live here.
  assets:
    - assets/images/

  # UI v2 fonts, bundled so nothing is fetched at runtime (works offline in the
  # field). Licences: assets/fonts/OFL-*.txt (SIL Open Font License 1.1).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"

flutter_native_splash:
  color: "#0E3B2C"
  image: assets/images/splashlogo.png

  android_12:
    color: "#0E3B2C"
    image: assets/images/splashlogo.png
    
  android: true
  ios: true